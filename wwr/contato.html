<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Fale conosco - Companhia de Rafting em Corredeiras. Entre em contato com nossa equipe para tirar dúvidas ou fazer reservas.">
    <meta name="author" content="Gisele Rodrigues de Lima Albuquerque">
    <title>Fale Conosco | Companhia de Rafting em Corredeiras</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <a id="logo_link" href="index.html">
            <img class="logo" src="imagens/logotipo.jpg" alt="Companhia de Rafting em Corredeiras">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main class="contato-main">
        <!-- Título e Informações da Empresa (Topo Centralizado) -->
        <section class="empresa-cabecalho">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <address>
                <p>123 Rua Principal do Rio</p>
                <p>Foz do Iguaçu, Paraná</p>
                <p>+55 45 99999-9999</p>
                <p><a href="mailto:info@correiras.com">info@correiras.com</a></p>
            </address>
        </section>

        <!-- Container Lado a Lado: Mapa à Esquerda e Formulário à Direita -->
        <div class="mapa-e-formulario">
            <div class="mapa-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.197582239339!2d-46.65867!3d-23.561414!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjPCsDMzJzQxLjEiUyA0NsKwMzknMzEuMiJX!5e0!3m2!1spt-BR!2sbr!4v1600000000000!5m2!1spt-BR!2sbr"
                  width="600" height="450" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Localização da Companhia no Google Maps"></iframe>
            </div>

            <form action="#" method="post" class="form-contato">
                <div class="form-row">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>
                </div>

                <div class="form-row">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                </div>

                <div class="form-row radio-row">
                    <span class="label-title">Propósito da Mensagem</span>
                    <div class="radio-options">
                        <label for="duvida">
                            <input type="radio" id="duvida" name="finalidade" value="Dúvida Geral"
                              checked>
                            Dúvida Geral
                        </label>
                        <label for="reserva">
                            <input type="radio" id="reserva" name="finalidade"
                              value="Pergunta sobre Reserva">
                            Pergunta sobre Reserva
                        </label>
                        <label for="sugestao">
                            <input type="radio" id="sugestao" name="finalidade" value="Sugestão">
                            Sugestão
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Digite aqui"
                      required></textarea>
                </div>

                <div class="form-row checkbox-row">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="sim">
                        Por favor, me inscreva na newsletter mensal
                    </label>
                </div>

                <button type="submit" id="btn-enviar" name="btn-enviar" class="btn-submit">Entrar em
                    Contato!</button>
            </form>
        </div>

        <!-- Seção da Equipe -->
        <section class="equipe-section">
            <h2>Estamos Aqui para Serví-lo</h2>
            <div class="equipe-grid">
                <figure class="funcionario">
                    <img src="imagens/funcionario1.jpg" alt="Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
                <figure class="funcionario">
                    <img src="imagens/funcionario2.jpg" alt="Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
                <figure class="funcionario">
                    <img src="imagens/funcionario3.jpg" alt="Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>Conteúdo de Rodapé incluindo Ícones/Links de Mídia Social</p>
        <nav class="redes-sociais">
            <a href="https://www.facebook.com"><img src="imagens/facebook.png" alt="Facebook"></a>
            <a href="https://www.whatsapp.com"><img src="imagens/whatsapp.png" alt="Whatsapp"></a>
            <a href="https://www.instagram.com"><img src="imagens/instagram.png"
                  alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
